name: ACR Build and Publish
run-name: ACR Build (${{ inputs.image_reference }})

on:
  workflow_dispatch:
    inputs:
      customization_config_url:
        description: "URL to JSON customization config"
        required: true
        type: string
      version:
        description: "Version/ref to build"
        required: true
        type: string
      source_ref:
        description: "Git ref (tag) to build from"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference (e.g., myregistry.azurecr.io/sponsor/controlr:sponsor-slot1)"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      customization_config_url: ${{ inputs.customization_config_url }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.source_ref }}
      skip_version_increment: true
      use_self_hosted_runners: true
      use_local_storage: true
      retention_days_artifacts: 1
      build_nugets: false
      notarize_mac_bundle: true
      prerelease: false
      run_tests: false
    secrets: inherit

  echo-environment:
    name: Echo Environment
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Echo Environment Variables
        run: |
          echo "Run ID: ${{ github.run_id }}"
          echo "Sponsor Login: ${{ inputs.sponsor_login }}"
          echo "Slot Number: ${{ inputs.slot_number }}"
          echo "Image Reference: ${{ inputs.image_reference }}"
          echo "Environment: ${{ inputs.environment }}"

  publish-acr:
    name: Publish to ACR
    needs: build
    if: ${{ always() }}
    uses: ./.github/workflows/publish-acr.yml
    with:
      run_id: ${{ github.run_id }}
      sponsor_login: ${{ inputs.sponsor_login }}
      slot_number: ${{ inputs.slot_number }}
      image_reference: ${{ inputs.image_reference }}
      environment: ${{ inputs.environment }}
      use_local_storage: true
      use_self_hosted_runners: true
    secrets: inherit
